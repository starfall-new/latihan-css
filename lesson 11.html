<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 11</title>
</head>
<body>
    <div class="grid-11a">
    <div class="col-blue">200px</div>
    <div class="col-pink">75px</div>
</div>

<br><br> <div class="grid-11b">
    <div class="col-blue">col1</div>
    <div class="col-pink">col2</div>
    <div class="col-blue">col3</div>
</div>

<style>
    .grid-11a, .grid-11b {
        display: grid;
        font-family: Arial;
        color: black;
        height: 50px;
        align-items: center;
    }

    .grid-11a {
        grid-template-columns: 200px 75px;
    }

    .grid-11b {
        grid-template-columns: 50px 1fr 75px;
    }

    .col-blue {
        background-color: lightblue;
        height: 100%;
        display: flex;
        align-items: center;
        padding-left: 5px;
    }

    .col-pink {
        background-color: lightpink;
        height: 100%;
        display: flex;
        align-items: center;
        padding-left: 5px;
    }

</style>

    <br><br>
    <div class="container-grid">
    <div>col1</div>
    <div>col2</div>
    <div>col3</div>
    <div>col4</div>
    
    <div>col1</div>
    <div>col2</div>
    <div>col3</div>
    <div>col4</div>
</div>

<style>
    .container-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); 
        gap: 10px;
        font-family: Arial;
    }

    .container-grid div {
        background-color: lightpink;
        padding: 10px;
        text-align: left;
    }
</style>

</body>
</html>
