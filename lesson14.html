<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 14</title>
</head>
<body>

    <div class="modal-overlay" id="myModal">
    <div class="modal-box">
        <h2>Modal Title</h2>
        <p>This is a modal</p>
        <button class="close-btn" id="closeBtn">Close</button>
    </div>
</div>

    <div class="side">
        <aside class="bar">
            <p class="font">right sidebar</p>
        </aside>
    </div>

    <div class="ava">
        <img src="adad.jpg" class="image">
        <img src="well - Copy.jpg" class="image">
        <img src="🍥     ◞      mornye.jpg" class="image">
    </div>

    <div class="upper">
        <img src="hmm.jpg" class="image">
        <p class="text">Oliver cat</p>
        <button class="bt1">Add friend</button>
        <button class="bt2">Massage</button>
    </div>

    <div class="channels-sidebar">
        <div class="channel-header">
            <span>INFO</span>
            <span>+</span>
        </div>
        <div class="channel-item"># new-videos</div>
        <div class="channel-item"># updates</div>
        <div class="channel-item"># faq</div>
    </div>

    <style>
        body {
            height: 3000px;
        }

        .upper {
            background-color: white;
            position: fixed;
            display: flex;
            align-items: center;
            width: 100%;
            left: 0;
            right: 0;
            padding: 10px 0;
        }

        .text {
            font-family: arial, sans-serif;
            font-weight: bold;
            margin-left: 10px;
        }

        .bt1 {
            background-color: rgb(54, 128, 255);
            color: white;
            border: none;
            height: 29px;
            border-radius: 5px;
            margin-left: auto;
            margin-right: 20px;
        }

        .bt2 {
            color: black;
            background-color: rgb(226, 226, 226);
            border: none;
            height: 29px;
            border-radius: 5px;
            margin-right: 20px;
            margin-left: 10px;
        }

        .bar {
            background-color: green;
            width: 100px;
            position: fixed;
            right: 0;
            top: 70px;
            bottom: 0;
            padding-top: 26px;
        }

        .font {
            color: white;
            font-family: arial,sans-serif;
            margin: 0;
        }

        .ava {
            display: flex;
            margin-top: 70px;
            flex-direction: column;
            background-color: rgba(21, 21, 21, 0.847);
            position: fixed;
            width: 80px;
            left: 0;
            top: 15px   ;
            bottom: 0;

        }

        .image {
            width: 50px;
            height: 50px;
            border-radius: 50px;
            margin: 0.6rem;
            object-fit: cover;
        }

        .modal-overlay {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.4); 
        display: flex;
        justify-content: center; 
        align-items: center;    
        z-index: 100; 
        }

        .modal-box {
        background-color: white;
        padding: 24px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        font-family: Arial, sans-serif;
        }

        .modal-box h2 {
        margin-top: 0;
        font-size: 24px;
        margin-bottom: 10px;
        }

        .modal-box p {
        color: #333;
        margin-bottom: 20px;
        }

        .close-btn {
        padding: 6px 16px;
        background-color: #e0e0e0;
        border: 1px solid #999;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        }

        .channels-sidebar {
        display: flex;
        flex-direction: column;
        background-color: #2f3136;
        position: fixed;
        width: 150px;
        left: 80px;
        top: 97px;
        bottom: 0;
        padding: 15px;
        color: #8e9297;
        }

        .channel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 15px;
        }

        .channel-item {
        font-size: 14px;
        margin: 8px 0;
        cursor: pointer;
         font-family: arial, sans-serif;
        }
    </style>

    <script>
    const modal = document.getElementById('myModal');
    const closeButton = document.getElementById('closeBtn');

    closeButton.addEventListener('click', function() {
        modal.style.display = 'none';
    });
</script>
</body>
</html>
